<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  
  <base href="$FLUTTER_BASE_HREF">

  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=no">
  <meta name="description" content="Trạm Sạc Tình Yêu - Nơi kết nối trái tim">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Love Station">

  <link rel="manifest" href="manifest.json">
  
  <link rel="stylesheet" type="text/css" href="https://fonts.googleapis.com/icon?family=Material+Icons">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      font-family: system-ui, sans-serif;
      -webkit-text-size-adjust: 100%;
    }
    /* Khóa chặt màn hình chuẩn cho cả iOS và Android */
    #flutter_target, flutter-view {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }
    .design-by {
      position: fixed;
      bottom: 12px;
      right: 12px;
      color: rgba(0, 0, 0, 0.4);
      font-size: 10px;
      background: rgba(255, 255, 255, 0.6);
      padding: 3px 8px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
      z-index: 1000;
      pointer-events: none;
    }
  </style>
</head>

  <div class="design-by">Design by WMQ</div>
