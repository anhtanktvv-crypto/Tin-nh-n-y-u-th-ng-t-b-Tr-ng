<!DOCTYPE html>
<html>
<head>
  <base href="/">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" href="icons/Icon-512.png">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Trạm Sạc Tình Yêu - Nơi kết nối trái tim">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Trạm Sạc">
  
  <title>Trạm Sạc Tình Yêu</title>
  <link rel="manifest" href="manifest.json">
   <meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trạm Sạc">
  <style>
    body {
      background-color: #1a1a2e;
      margin: 0; padding: 0;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #ffafcc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .loader {
      text-align: center;
    }
    .heart {
      font-size: 50px;
      animation: beat .25s infinite alternate;
      transform-origin: center;
    }
    @keyframes beat {
      to { transform: scale(1.2); }
    }
    /* Chặn menu chuột phải và bôi đen để giống App thật */
    * {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body>
  <meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trạm Sạc">
<link rel="apple-touch-icon" href="icons/Icon-192.png">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <div class="loader">
    <div class="heart">❤️</div>
    <p>Đang kết nối trạm sạc...</p>
  </div>

  <script>
    {{flutter_bootstrap_js}}
    
    // Cấu hình ép sử dụng HTML Renderer để nét căng trên iPhone
    window.addEventListener('load', function(ev) {
      _flutter.loader.load({
        config: {
          renderer: "html",
        },
        onEntrypointLoaded: async function(engineInitializer) {
          const engine = await engineInitializer.initializeEngine();
          await engine.runApp();
        }
      });
    });
  </script>
</body>
</html>
